<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ML Algorithm Recommender</title>
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #0d0618;
            --bg2: #1a0d2e;
            --bg3: #231040;
            --bg4: #2d1850;
            --accent: #8b5cf6;
            --accent2: #a78bfa;
            --accent3: #c4b5fd;
            --cream: #f0ebff;
            --cream2: #d8d0f0;
            --text: #f0ebff;
            --text2: #b8aed8;
            --text3: #7c6fa0;
            --border: rgba(139, 92, 246, 0.18);
            --border2: rgba(139, 92, 246, 0.35);
            --success: #86efac;
            --danger: #f87171;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            --glow: 0 0 24px rgba(139, 92, 246, 0.2);
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Times New Roman', Times, serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ── GRID BACKGROUND ── */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(139, 92, 246, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(139, 92, 246, 0.04) 1px, transparent 1px);
            background-size: 52px 52px;
            pointer-events: none;
            z-index: 0;
        }

        /* ── RADIAL GLOW ── */
        body::after {
            content: '';
            position: fixed;
            top: -150px;
            left: 50%;
            transform: translateX(-50%);
            width: 900px;
            height: 600px;
            background: radial-gradient(ellipse, rgba(139, 92, 246, 0.08) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        /* ── SVG BACKGROUND ── */
        .bg-neural {
            position: fixed;
            top: 0;
            right: -40px;
            width: 480px;
            height: 100vh;
            opacity: 0.06;
            pointer-events: none;
            z-index: 0;
        }

        .bg-scatter {
            position: fixed;
            bottom: 0;
            left: -20px;
            width: 300px;
            height: 50vh;
            opacity: 0.05;
            pointer-events: none;
            z-index: 0;
        }

        /* ── LAYOUT ── */
        .wrap {
            position: relative;
            z-index: 1;
            max-width: 920px;
            margin: 0 auto;
            padding: 0 28px 80px;
        }

        /* ── HOME ── */
        .home {
            padding: 72px 0 52px;
            text-align: center;
        }

        .home-eyebrow {
            font-size: 11px;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--accent2);
            margin-bottom: 20px;
            opacity: 0;
            animation: fadeUp 0.7s ease forwards 0.1s;
        }

        .home h1 {
            font-size: clamp(22px, 5vw, 55px);
            font-weight: normal;
            line-height: 1.12;
            letter-spacing: -0.01em;
            margin-bottom: 20px;
            opacity: 0;
            animation: fadeUp 0.7s ease forwards 0.2s;
        }

        .home h1 em {
            font-style: italic;
            color: var(--accent2);
        }

        .home-sub {
            font-size: 16px;
            color: var(--text2);
            max-width: 520px;
            margin: 0 auto 0;
            line-height: 1.75;
            font-style: italic;
            opacity: 0;
            animation: fadeUp 0.7s ease forwards 0.3s;
        }

        /* ── FORM CARD ── */
        .form-card {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 36px 40px;
            margin-bottom: 40px;
            box-shadow: var(--shadow);
            opacity: 0;
            animation: fadeUp 0.7s ease forwards 0.45s;
        }

        .form-label {
            font-size: 10px;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--text3);
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-label::after {
            /* content: ''; */
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .inputs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 22px;
            margin-bottom: 30px;
        }

        .input-group label {
            display: block;
            font-size: 11px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--text3);
            margin-bottom: 9px;
        }

        .select-wrap {
            position: relative;
        }

        .select-wrap::after {
            content: '▾';
            position: absolute;
            right: 13px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--accent2);
            font-size: 12px;
            pointer-events: none;
        }

        select {
            width: 100%;
            padding: 11px 34px 11px 14px;
            background: var(--bg3);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            font-family: 'Times New Roman', Times, serif;
            font-size: 14px;
            appearance: none;
            cursor: pointer;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        select:focus,
        select:hover {
            border-color: var(--border2);
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.08);
        }

        select option {
            background: var(--bg3);
            color: var(--text);
        }

        .btn-run {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 12px 32px;
            background: var(--accent);
            color: var(--cream);
            font-family: 'Times New Roman', Times, serif;
            font-size: 15px;
            font-style: italic;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            letter-spacing: 0.02em;
            transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
        }

        .btn-run:hover {
            background: var(--accent2);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(139, 92, 246, 0.3);
        }

        .btn-run:active {
            transform: translateY(0);
        }

        .btn-arrow {
            font-style: normal;
            transition: transform 0.2s;
        }

        .btn-run:hover .btn-arrow {
            transform: translateX(4px);
        }

        /* ── RESULTS ── */
        #results {
            margin-top: 8px;
        }

        .results-head {
            margin-bottom: 26px;
        }

        .results-head h2 {
            font-size: 24px;
            font-weight: normal;
            margin-bottom: 6px;
        }

        .results-head h2 em {
            font-style: italic;
            color: var(--accent2);
        }

        .results-meta {
            font-size: 13px;
            color: var(--text3);
            font-style: italic;
        }

        .algo-list {
            display: flex;
            flex-direction: column;
            gap: 22px;
        }

        /* ── ALGO CARD ── */
        .algo-card {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: var(--shadow);
            opacity: 0;
            animation: slideUp 0.4s ease forwards;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .algo-card:hover {
            border-color: var(--border2);
            box-shadow: var(--glow);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(14px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(18px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card-top {
            padding: 26px 30px 20px;
            border-bottom: 1px solid var(--border);
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 14px;
            align-items: start;
        }

        .badge-row {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }

        .badge {
            font-size: 10px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            padding: 3px 10px;
            border-radius: 20px;
            border: 1px solid;
        }

        .badge-best {
            color: var(--accent2);
            border-color: var(--accent2);
            background: rgba(167, 139, 250, 0.1);
        }

        .badge-alt {
            color: var(--text3);
            border-color: var(--border);
            background: transparent;
        }

        .badge-rank {
            color: var(--accent3);
            border-color: rgba(196, 181, 253, 0.3);
            background: rgba(196, 181, 253, 0.06);
        }

        .algo-name {
            font-size: 21px;
            font-weight: normal;
            color: var(--cream);
            margin-bottom: 8px;
        }

        .algo-reason {
            font-size: 14px;
            color: var(--text2);
            line-height: 1.65;
            font-style: italic;
            max-width: 580px;
        }

        .rank-num {
            font-size: 40px;
            font-style: italic;
            color: var(--border2);
            line-height: 1;
        }

        .card-body {
            padding: 22px 30px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            border-bottom: 1px solid var(--border);
        }

        .pc-col h4 {
            font-size: 10px;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            margin-bottom: 12px;
            font-weight: normal;
        }

        .pc-col.pros h4 {
            color: var(--success);
        }

        .pc-col.cons h4 {
            color: var(--danger);
        }

        .pc-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .pc-list li {
            font-size: 13.5px;
            color: var(--text2);
            line-height: 1.5;
            display: flex;
            gap: 8px;
        }

        .pros .pc-list li::before {
            content: '+';
            color: var(--success);
            flex-shrink: 0;
            font-size: 12px;
            margin-top: 1px;
        }

        .cons .pc-list li::before {
            content: '–';
            color: var(--danger);
            flex-shrink: 0;
            font-size: 12px;
            margin-top: 1px;
        }

        /* ── CODE ── */
        .code-section {
            border-top: 1px solid var(--border);
        }

        .code-toggle {
            width: 100%;
            background: none;
            border: none;
            padding: 13px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            color: var(--text3);
            font-family: 'Times New Roman', Times, serif;
            font-size: 13px;
            font-style: italic;
            transition: background 0.15s, color 0.15s;
            text-align: left;
        }

        .code-toggle:hover {
            background: rgba(139, 92, 246, 0.05);
            color: var(--accent2);
        }

        .chevron {
            font-style: normal;
            font-size: 11px;
            transition: transform 0.2s;
        }

        .code-toggle.open .chevron {
            transform: rotate(180deg);
        }

        .code-wrap {
            display: none;
            padding: 0 30px 24px;
        }

        .code-wrap.open {
            display: block;
        }

        .code-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg3);
            border: 1px solid var(--border);
            border-bottom: none;
            padding: 9px 14px;
            border-radius: 6px 6px 0 0;
        }

        .code-lang {
            font-size: 10px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--text3);
        }

        .copy-btn {
            font-family: 'Times New Roman', Times, serif;
            font-size: 11px;
            color: var(--accent2);
            background: rgba(139, 92, 246, 0.1);
            border: 1px solid var(--border2);
            padding: 3px 12px;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.15s;
            letter-spacing: 0.04em;
        }

        .copy-btn:hover {
            background: rgba(139, 92, 246, 0.2);
        }

        pre {
            background: var(--bg3);
            border: 1px solid var(--border);
            border-radius: 0 0 6px 6px;
            padding: 18px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 12px;
            line-height: 1.75;
            color: var(--accent3);
            overflow-x: auto;
            white-space: pre;
        }

        /* ── EMPTY / ERROR ── */
        .empty-state {
            text-align: center;
            color: var(--text3);
            font-style: italic;
            font-size: 15px;
        }

        .error-box {
            background: rgba(248, 113, 113, 0.06);
            border: 1px solid rgba(248, 113, 113, 0.25);
            border-radius: 8px;
            padding: 16px 20px;
            color: var(--danger);
            font-size: 14px;
            font-style: italic;
        }

        /* ── SCROLLBAR ── */
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--bg4);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent);
        }

        /* ── RESPONSIVE ── */
        @media(max-width:640px) {
            .form-card {
                padding: 24px 18px;
            }

            .card-top {
                grid-template-columns: 1fr;
            }

            .card-body {
                grid-template-columns: 1fr;
            }

            .hero {
                padding: 48px 0 36px;
            }

            .rank-num {
                display: none;
            }

            pre {
                font-size: 11px;
            }
        }
    </style>
</head>

    <div class="wrap">

        <!-- HOME -->
        <section class="home">
            <h1>ML Algorithm<em> Recommender</em></h1>
            <h1>Find the <em>right algorithm</em><br>for your problem</h1>
            <p class="hero-sub">Answer three questions. Get ranked algorithm recommendations with reasoning, pros, cons,
                and ready-to-run Python code.</p>
        </section>

        <!-- FORM -->
        <div class="form-card">
            <div class="form-label">Configure your problem</div>
            <div class="inputs-grid">
                <div class="input-group">
                    <label>1. Problem Type</label>
                    <div class="select-wrap">
                        <select id="problem">
                            <option value="">Select...</option>
